# Continuous integration for VeriHarness.
#
# The point of this workflow is narrow and worth stating, because a green badge
# that proves nothing is worse than no badge. It answers one question: can a
# stranger, starting from a clean checkout on a machine that is not the
# author's, get a working installation?
#
# That question was open until 2026-09-10. `RC_GATE.md` carried "clean install"
# as NOT_RUN through three release candidates, honestly labelled but unmeasured,
# because the only machine that had ever built this package was the one that
# wrote it.
#
# Note what the install job does *not* treat as success. Importing `hoh` proves
# nothing: this project shipped a wheel once that imported cleanly and could not
# execute a single acceptance check, because the guard pattern files were not
# packaged. `tools/clean_install_check.py` therefore reads the policy back out
# of the installed copy and calls the guard, requiring it to allow a harmless
# command and refuse a forbidden one. Its own negative control removes the
# package-data declaration and requires the check to go red.
#
# Herdr is deliberately absent here. HoH refuses to start without HERDR_ENV=1,
# and standing up a terminal multiplexer in CI would test the mock, not the
# integration. That gap is real and stays named rather than papered over: see
# docs/LIMITATIONS.md.

name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  artifact-transfer:
    name: release artifact transfer integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Prepare a nested bundle and its checksum manifest
        run: |
          mkdir -p transfer-source/nested
          cp .github/releases/v0.1.0.json transfer-source/nested/receipt.json
          cp README.md transfer-source/README.md
          cd transfer-source
          sha256sum README.md nested/receipt.json > SHA256SUMS.txt
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: release-transfer-check
          path: transfer-source/
          if-no-files-found: error
          retention-days: 1
      - uses: actions/download-artifact@v8.0.1
        with:
          name: release-transfer-check
          path: transfer-downloaded
      - name: Verify downloaded bytes and directory layout
        working-directory: transfer-downloaded
        run: sha256sum --check SHA256SUMS.txt

  suite:
    name: tests and linter (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor is what pyproject declares (>=3.11); the ceiling is the
        # newest release. A version that is claimed as supported and never
        # exercised is a claim, not a fact.
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # `setuptools` is explicit and not incidental. U3 in tools/union_gate.py
      # builds a wheel with `pip wheel --no-build-isolation`, which requires the
      # build backend to be present in the environment rather than fetched. A
      # fresh Python 3.13 venv has no setuptools at all, so U3 skipped, and a
      # skipped invariant does not fail the gate -- the suite then reported six
      # failures with no visible cause. Installing the project itself, not just
      # the test tooling, is the other half: it is what proves `dependencies` in
      # pyproject.toml is complete. The first run of this workflow installed
      # only pytest and ruff and every test module failed on
      # `ModuleNotFoundError: No module named 'pydantic'` -- a declared runtime
      # dependency that happened to be present on the author's machine and
      # nowhere else. That is precisely the failure this job exists to find.
      - name: Install the project and test tooling
        run: |
          python -m pip install --upgrade pip setuptools
          python -m pip install -e .
          python -m pip install pytest ruff

      - name: Ruff (F and E9 only, matching the release gate)
        run: ruff check --select F,E9 src tests tools

      - name: Test suite
        run: python -m pytest -q

  clean-install:
    name: clean install from a built wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install build

      # Builds a wheel and an sdist from a clean copy, installs the wheel into
      # a fresh virtual environment, runs the console script, reads the
      # packaged policy back out of the install, and exercises the guard.
      - name: Build, install into a fresh venv, and exercise the guard
        run: python tools/clean_install_check.py --source .

  sandbox:
    name: sandbox tests on a machine that is not the author's
    runs-on: ubuntu-latest
    # The job reports whether this environment can host the sandbox at all.
    # It does not fail the workflow for being the wrong kind of machine.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install bubblewrap and the project
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bubblewrap
          python -m pip install --upgrade pip setuptools
          python -m pip install -e .
          python -m pip install pytest

      # The sandbox tests skip themselves when no usable backend is present,
      # which is right for a developer machine and useless as external
      # evidence: a sandbox test that passes where there is no sandbox has
      # measured nothing. So this step first refuses to continue unless bwrap
      # can actually create a namespace here, and then requires the tests to
      # have RUN rather than merely not failed.
      #
      # GitHub's runners may restrict user namespaces. If they do, this job
      # fails loudly and the sandbox stays externally unverified until it runs
      # on a Linux environment that permits them -- which is a true statement,
      # where a green skip would be a false one.
      # Measured on 2026-09-11: GitHub's hosted runners install bubblewrap
      # happily and then refuse the network namespace it needs --
      # `bwrap: loopback: Failed RTM_NEWADDR: Operation not permitted`. That is
      # a fact about the runner, not about the sandbox, and the two must not be
      # reported as the same thing.
      #
      # So the probe records which case this is. If the namespace works, the
      # tests run and a skip fails the job. If it does not, the job says the
      # environment is unsupported and stops -- without claiming the sandbox
      # passed, and without pretending the sandbox is broken. The status matrix
      # reads external sandbox verification as NOT_MEASURED until this runs
      # somewhere that permits namespaces.
      - id: probe
        name: Can this runner create a namespace at all?
        run: |
          if bwrap --ro-bind /usr /usr --unshare-all --die-with-parent true 2>probe.err; then
            echo "usable=yes" >> "$GITHUB_OUTPUT"
            echo "bwrap can create a namespace on this runner"
          else
            echo "usable=no" >> "$GITHUB_OUTPUT"
            echo "::notice title=Sandbox unsupported here::$(head -1 probe.err)"
            echo "This runner does not permit the namespace the sandbox needs:"
            cat probe.err
            echo
            echo "The sandbox is therefore NOT verified by this job. It is also not"
            echo "shown to be broken: on a machine that permits namespaces the same"
            echo "tests pass. What this job establishes is that external verification"
            echo "still needs a Linux environment that allows user namespaces."
          fi

      - name: Sandbox tests, and they must actually run
        if: steps.probe.outputs.usable == 'yes'
        run: |
          python -m pytest -q tests/test_sandbox.py -p no:randomly \
            --junitxml=sandbox.xml
          python - <<'PY'
          import sys, xml.etree.ElementTree as ET

          wurzel = ET.parse("sandbox.xml").getroot()
          suiten = wurzel.iter("testsuite") if wurzel.tag != "testsuite" else [wurzel]
          gesamt = uebersprungen = 0
          for s in suiten:
              gesamt += int(s.get("tests", 0))
              uebersprungen += int(s.get("skipped", 0))
          gelaufen = gesamt - uebersprungen
          print(f"{gesamt} sandbox tests, {uebersprungen} skipped, {gelaufen} actually ran")
          if uebersprungen:
              sys.exit(
                  f"{uebersprungen} sandbox test(s) skipped. A skipped sandbox test is "
                  "not a passing one: this job exists to measure the sandbox somewhere "
                  "other than the machine that wrote it."
              )
          if gelaufen == 0:
              sys.exit("no sandbox test ran at all")
          PY

  minimal-example:
    name: the recorded rejection still reads
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # examples/minimal/ ships a recorded rejection: a real candidate, a real
      # failing preservation check, and the receipts behind the refusal. Running
      # the loop itself needs Herdr and three agent sessions of quota, so what
      # is checked here is that the recorded evidence is present and parses --
      # the part a reader can verify without an API key.
      - name: The recorded rejection is present and parses
        run: |
          python - <<'PY'
          import json, pathlib, sys

          wurzel = pathlib.Path("examples/minimal")
          if not wurzel.is_dir():
              sys.exit("examples/minimal/ is missing")

          belege = sorted(wurzel.rglob("receipts/*.json"))
          if not belege:
              sys.exit("no receipts under examples/minimal/ -- the recorded rejection is the example")

          fehler = []
          for f in belege:
              try:
                  json.loads(f.read_text())
              except Exception as e:
                  fehler.append(f"{f}: {e}")
          if fehler:
              sys.exit("unparseable receipts:\n  " + "\n  ".join(fehler))

          print(f"{len(belege)} recorded receipts, all parse")
          PY
