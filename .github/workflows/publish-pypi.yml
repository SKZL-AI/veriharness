# Distributes one audited, immutable hoh release to TestPyPI and then PyPI.
#
# Generalised on 2026-10-14 from the workflow that published v0.1.0 alone. What
# did not change: the file name and the two environment names (`testpypi`,
# `pypi`), because the trusted publishers on the indexes are registered against
# them; the build-once rule (the bytes that were tested are the bytes that are
# published); the refusal of an unknown or unpinned tag; the full-file-set check
# against an existing index release. What changed: the tag is an input that must
# be listed, with its pinned identity, in `tools/distribution_release.py`
# (`RELEASES`), and the file names, index addresses, environment addresses and
# artifact name follow from it. Dispatch from `main` only, one release at a time.
name: Distribute an immutable hoh release

on:
  workflow_dispatch:
    inputs:
      release_ref:
        description: Immutable source tag (only a tag listed and pinned in tools/distribution_release.py is accepted)
        required: true
        default: v0.1.0
        type: string

permissions:
  contents: read

concurrency:
  group: hoh-${{ inputs.release_ref }}-distribution
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'SKZL-AI/veriharness' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      test_exists: ${{ steps.test-existing.outputs.exists }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          path: control
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ inputs.release_ref }}
          fetch-depth: 0
          path: source
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify immutable source identity and metadata
        id: release
        env:
          RELEASE_REF: ${{ inputs.release_ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python control/tools/distribution_release.py identity --source source --release-ref "$RELEASE_REF"
          gh api "repos/SKZL-AI/veriharness/releases/tags/$RELEASE_REF" > release.json
          EXPECT_PRE="$(python control/tools/distribution_release.py prerelease --release-ref "$RELEASE_REF")"
          EXPECT_PRE="$EXPECT_PRE" python - <<'PY'
          import json, os
          release = json.load(open('release.json'))
          assert release['tag_name'] == os.environ['RELEASE_REF']
          assert not release['draft']
          # the GitHub release must say what the table says: a pre-release is a pre-release, a release is not
          assert release['prerelease'] == (os.environ['EXPECT_PRE'] == 'true'), release['prerelease']
          PY
          # The tag is validated against the pinned table above before it is
          # used as a path or an output: only [v0-9.abrc] survives.
          case "$RELEASE_REF" in *[!v0-9.abrc]*) echo "unexpected characters in the release ref"; exit 1;; esac
          echo "tag=$RELEASE_REF" >> "$GITHUB_OUTPUT"
          echo "version=${RELEASE_REF#v}" >> "$GITHUB_OUTPUT"
      - name: Build wheel and sdist once
        run: |
          python -m pip install --upgrade pip build twine
          mkdir -p bundle/dist
          python -m build --outdir "$GITHUB_WORKSPACE/bundle/dist" source
          python -m twine check --strict bundle/dist/*
          python control/tools/distribution_release.py archive --source source --release-ref "${{ steps.release.outputs.tag }}"
          python -m pip freeze > bundle/build-tool-versions.txt
      - name: Official clean install checker, reusing the same distributions
        run: python control/tools/clean_install_check.py --source source --dist bundle/dist
      - name: Fresh wheel install and CLI/metadata/policy smoke
        env:
          HOH_EXPECT_VERSION: ${{ steps.release.outputs.version }}
        run: |
          python -m venv "$RUNNER_TEMP/wheel-venv"
          "$RUNNER_TEMP/wheel-venv/bin/python" -m pip install --no-cache-dir --index-url https://pypi.org/simple bundle/dist/*.whl
          cp control/tools/distribution_smoke.py "$RUNNER_TEMP/distribution_smoke.py"
          export PATH="$RUNNER_TEMP/wheel-venv/bin:$PATH"
          cd "$RUNNER_TEMP"
          python -I distribution_smoke.py | tee "$GITHUB_WORKSPACE/bundle/wheel-smoke.txt"
      - name: Check existing TestPyPI files without skip-existing
        id: test-existing
        run: python control/tools/distribution_release.py index --index testpypi --allow-missing --release-ref "${{ steps.release.outputs.tag }}"
      - name: Retain verification tools with the canonical artifact bundle
        run: |
          cp control/tools/distribution_release.py control/tools/distribution_smoke.py bundle/
          python control/tools/distribution_release.py hashes --release-ref "${{ steps.release.outputs.tag }}"
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: hoh-${{ steps.release.outputs.tag }}-canonical
          path: bundle/
          if-no-files-found: error
          retention-days: 90

  testpypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/hoh/${{ needs.build.outputs.version }}/
    permissions:
      contents: read
      id-token: write
    outputs:
      tag: ${{ needs.build.outputs.tag }}
      version: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          name: hoh-${{ needs.build.outputs.tag }}-canonical
          path: bundle
      - name: Verify artifact bytes
        working-directory: bundle/dist
        run: sha256sum --check ../SHA256SUMS.txt
      - uses: pypa/gh-action-pypi-publish@release/v1
        if: needs.build.outputs.test_exists != 'true'
        with:
          packages-dir: bundle/dist/
          repository-url: https://test.pypi.org/legacy/

  testpypi-smoke:
    needs: testpypi
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ needs.testpypi.outputs.tag }}
      version: ${{ needs.testpypi.outputs.version }}
      pypi_exists: ${{ steps.pypi-existing.outputs.exists }}
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          name: hoh-${{ needs.testpypi.outputs.tag }}-canonical
          path: bundle
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify TestPyPI metadata and downloaded file hashes
        run: python bundle/distribution_release.py index --index testpypi --release-ref "${{ needs.testpypi.outputs.tag }}"
      - name: Fresh TestPyPI install; dependencies only from production PyPI
        env:
          HOH_EXPECT_VERSION: ${{ needs.testpypi.outputs.version }}
        run: |
          python -m venv "$RUNNER_TEMP/test-venv"
          "$RUNNER_TEMP/test-venv/bin/python" -m pip install --no-cache-dir --index-url https://pypi.org/simple 'pydantic>=2.0'
          # index lag: a bounded retry (five tries, thirty seconds apart); the file set and digests were verified in the step above
          for attempt in 1 2 3 4 5; do
            "$RUNNER_TEMP/test-venv/bin/python" -m pip install --no-cache-dir --no-deps --index-url https://test.pypi.org/simple "hoh==$HOH_EXPECT_VERSION" && break
            [ "$attempt" -lt 5 ] && sleep 30 || exit 1
          done
          cp bundle/distribution_smoke.py "$RUNNER_TEMP/distribution_smoke.py"
          export PATH="$RUNNER_TEMP/test-venv/bin:$PATH"
          cd "$RUNNER_TEMP"
          python -I distribution_smoke.py | tee "$GITHUB_WORKSPACE/bundle/testpypi-smoke.txt"
      - name: Verify any existing production version before approval
        id: pypi-existing
        run: python bundle/distribution_release.py index --index pypi --allow-missing --release-ref "${{ needs.testpypi.outputs.tag }}"
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: testpypi-verification
          path: |
            bundle/testpypi-verification.json
            bundle/testpypi-smoke.txt
          if-no-files-found: error

  pypi:
    needs: testpypi-smoke
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/hoh/${{ needs.testpypi-smoke.outputs.version }}/
    permissions:
      contents: read
      id-token: write
    outputs:
      tag: ${{ needs.testpypi-smoke.outputs.tag }}
      version: ${{ needs.testpypi-smoke.outputs.version }}
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          name: hoh-${{ needs.testpypi-smoke.outputs.tag }}-canonical
          path: bundle
      - name: Verify the identical tested artifact bytes
        working-directory: bundle/dist
        run: sha256sum --check ../SHA256SUMS.txt
      - uses: pypa/gh-action-pypi-publish@release/v1
        if: needs.testpypi-smoke.outputs.pypi_exists != 'true'
        with:
          packages-dir: bundle/dist/

  pypi-smoke:
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          name: hoh-${{ needs.pypi.outputs.tag }}-canonical
          path: bundle
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Verify production metadata and downloaded file hashes
        run: python bundle/distribution_release.py index --index pypi --release-ref "${{ needs.pypi.outputs.tag }}"
      - name: Independent installation exclusively from production PyPI
        env:
          HOH_EXPECT_VERSION: ${{ needs.pypi.outputs.version }}
        run: |
          python -m venv "$RUNNER_TEMP/pypi-venv"
          # index lag: a bounded retry (five tries, thirty seconds apart); the file set and digests were verified in the step above
          for attempt in 1 2 3 4 5; do
            "$RUNNER_TEMP/pypi-venv/bin/python" -m pip install --no-cache-dir --index-url https://pypi.org/simple "hoh==$HOH_EXPECT_VERSION" && break
            [ "$attempt" -lt 5 ] && sleep 30 || exit 1
          done
          cp bundle/distribution_smoke.py "$RUNNER_TEMP/distribution_smoke.py"
          export PATH="$RUNNER_TEMP/pypi-venv/bin:$PATH"
          cd "$RUNNER_TEMP"
          python -I distribution_smoke.py | tee "$GITHUB_WORKSPACE/bundle/pypi-smoke.txt"
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: pypi-verification-${{ matrix.python }}
          path: |
            bundle/pypi-verification.json
            bundle/pypi-smoke.txt
          if-no-files-found: error
