<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" role="img" aria-labelledby="t d">
  <title id="t">How the orchestrating session hands over to its successor</title>
  <desc id="d">A policy asks the running session for a handover note when its context reaches a threshold. The product freezes a capsule of derived facts, the operator's decisions kept verbatim and advisory context, starts the successor, which re-derives the facts and acknowledges. Only then does the lease pass to the next epoch and the predecessor is fenced and retired. The chain repeats. A successor can wake its predecessor to consult it; that is a fence, not isolation.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#7fe3d8"/>
    </marker>
  </defs>
  <rect width="1100" height="520" rx="16" fill="#0f1c2e"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" text-anchor="middle">
    <text x="550" y="40" font-size="22" font-weight="700" fill="#f2f6fa">One orchestrating session after another, without a gap</text>

    <g font-size="16" fill="#eaf1f7">
      <rect x="30" y="80" width="190" height="96" rx="12" fill="#1d3552" stroke="#2ec4b6" stroke-width="1.5"/>
      <text x="125" y="110" font-weight="700">Session, epoch n</text>
      <text x="125" y="134" font-size="13" fill="#b9c7d6">holds the lease and the</text>
      <text x="125" y="152" font-size="13" fill="#b9c7d6">master token</text>

      <rect x="260" y="80" width="190" height="96" rx="12" fill="#1d3552" stroke="#2ec4b6" stroke-width="1.5"/>
      <text x="355" y="110" font-weight="700">Policy asks</text>
      <text x="355" y="134" font-size="13" fill="#b9c7d6">context reached its threshold:</text>
      <text x="355" y="152" font-size="13" fill="#b9c7d6">write a handover note</text>

      <rect x="490" y="80" width="190" height="96" rx="12" fill="#3a2f12" stroke="#ffbf47" stroke-width="1.5"/>
      <text x="585" y="110" font-weight="700">Capsule frozen</text>
      <text x="585" y="134" font-size="13" fill="#e6d3a0">derived facts, operator</text>
      <text x="585" y="152" font-size="13" fill="#e6d3a0">decisions verbatim, advice</text>

      <rect x="720" y="80" width="190" height="96" rx="12" fill="#1d3552" stroke="#2ec4b6" stroke-width="1.5"/>
      <text x="815" y="110" font-weight="700">Successor starts</text>
      <text x="815" y="134" font-size="13" fill="#b9c7d6">re-derives every fact</text>
      <text x="815" y="152" font-size="13" fill="#b9c7d6">from the world</text>
    </g>
    <g stroke="#7fe3d8" stroke-width="2.2" fill="none" marker-end="url(#a)">
      <path d="M220 128 H252"/>
      <path d="M450 128 H482"/>
      <path d="M680 128 H712"/>
    </g>

    <g font-size="16" fill="#eaf1f7">
      <rect x="720" y="250" width="190" height="96" rx="12" fill="#17402f" stroke="#5ad19a" stroke-width="1.5"/>
      <text x="815" y="280" font-weight="700">Acknowledged</text>
      <text x="815" y="304" font-size="13" fill="#bfe3d0">only if everything</text>
      <text x="815" y="322" font-size="13" fill="#bfe3d0">re-derived</text>

      <rect x="490" y="250" width="190" height="96" rx="12" fill="#17402f" stroke="#5ad19a" stroke-width="1.5"/>
      <text x="585" y="280" font-weight="700">Lease passes</text>
      <text x="585" y="304" font-size="13" fill="#bfe3d0">successor holds the</text>
      <text x="585" y="322" font-size="13" fill="#bfe3d0">next epoch</text>

      <rect x="260" y="250" width="190" height="96" rx="12" fill="#3b1f27" stroke="#ff8a8a" stroke-width="1.5"/>
      <text x="355" y="280" font-weight="700">Predecessor fenced</text>
      <text x="355" y="304" font-size="13" fill="#f0c4c4">its token is stale,</text>
      <text x="355" y="322" font-size="13" fill="#f0c4c4">it is retired</text>

      <rect x="30" y="250" width="190" height="96" rx="12" fill="#1d3552" stroke="#2ec4b6" stroke-width="1.5"/>
      <text x="125" y="280" font-weight="700">Session, next epoch</text>
      <text x="125" y="304" font-size="13" fill="#b9c7d6">keeps working; the</text>
      <text x="125" y="322" font-size="13" fill="#b9c7d6">chain repeats</text>
    </g>
    <path d="M815 176 V242" stroke="#7fe3d8" stroke-width="2.2" fill="none" marker-end="url(#a)"/>
    <g stroke="#7fe3d8" stroke-width="2.2" fill="none" marker-end="url(#a)">
      <path d="M720 298 H688"/>
      <path d="M490 298 H458"/>
      <path d="M260 298 H228"/>
    </g>

    <rect x="30" y="392" width="1040" height="96" rx="12" fill="#14243a" stroke="#2b4568" stroke-width="1"/>
    <text x="550" y="422" font-size="15" fill="#e3ebf3">At no moment are there two orchestrators. If anything fails to re-derive, the predecessor stays master.</text>
    <text x="550" y="446" font-size="15" fill="#e3ebf3">A successor that needs what its predecessor knew can wake and consult it. The woken session's credentials are stale,</text>
    <text x="550" y="468" font-size="15" fill="#e3ebf3">so every act it tries is refused as a stale master: a fence, not isolation. Merged on the development line, not in a release.</text>
  </g>
</svg>
